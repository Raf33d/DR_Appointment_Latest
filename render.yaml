# Render Blueprint: one free web service that runs the API and serves both
# websites. Patient website at "/", staff panel at "/admin/".
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: medbook
    runtime: node
    plan: free
    buildCommand: >-
      npm ci --prefix backend &&
      npm ci --include=dev --prefix frontend &&
      npm ci --include=dev --prefix admin &&
      npm run build
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

# Netlify settings for this site. In Netlify, set "Base directory" to this folder.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: send every path to index.html so links like /my-appointments
# still work when opened directly or refreshed.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
